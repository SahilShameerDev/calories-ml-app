<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./index.css">
    <title>BMR</title>
</head>
<body>
    <div class="nav" id="nav">
        <div class="logo" id="logo">
            <img src="../assets/LOGO_PNG.png" alt="" srcset="">
        </div>
            <div class="list" id="list">
                <ul>
                    <li>Home</li>
                    <li>Login</li>
                    <li>Register</li>
                    <li>About Us</li>
                </ul>
            </div>
        </div>
        <div class="form" id="form">
            <form action="" class="form-main" id="formMain">
                <input type="number" name="height" id="height" placeholder="Height">
                <input type="text" name="gender" id="gender" placeholder="Gender">
                <input type="number" name="actual_weight" id="actual_weight" placeholder="Current Weight">
                <input type="number" name="desired_weight" id="desired_weight" placeholder="Target Weight">
                <input type="text" name="purpose" id="purpose" placeholder="Purpose">
                <input type="number" name="age" id="age" placeholder="Age">
                <input type="text" name="activity" id="activity" placeholder="Activity Level">
                <button type="submit" class="btn" id="regBtn">Submit </button>
            </form>
        </div>
        <div class="footer" id="footer">
            <div class="footer-content">
                <p>© 2025 All Rights Reserved.</p>
            </div>
        </div>
    <script src="index.js"></script>
</body>
</html>
